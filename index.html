<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login - CUEDESK BY REHAN</title>

    <!-- Supabase ES Module Import Map -->
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
        }
      }
    </script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <main class="login-container" role="main">
        <header class="login-header">
            <h1 class="brand-title">BARE TALLIES</h1>
            <p class="brand-subtitle">Snooker Club Management</p>
        </header>

        <section class="login-card" aria-labelledby="login-heading">
            <h2 id="login-heading" class="login-heading">Owner Login</h2>

            <form id="login-form" class="login-form" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        required 
                        autocomplete="email" 
                        placeholder="owner@example.com"
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            required 
                            autocomplete="current-password" 
                            placeholder="Enter your password"
                        >
                        <button 
                            type="button" 
                            id="password-toggle" 
                            class="password-toggle-btn" 
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <div id="error-message" class="error-message" role="alert" aria-live="polite" hidden></div>

                <button type="submit" id="submit-btn" class="btn btn-primary">
                    <span class="btn-text">Sign In</span>
                    <span id="loading-indicator" class="loading-spinner" hidden aria-hidden="true"></span>
                </button>
            </form>
        </section>

        <footer class="login-footer">
            <p>&copy; BARE TALLIES. All rights reserved.</p>
        </footer>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
