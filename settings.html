<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings & Rates - CUEDESK</title>

    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
        }
      }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <style>
        .settings-container {
            padding: 2rem;
            max-width: 800px;
        }
        .settings-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-card);
        }
        .settings-title {
            color: var(--gold-primary);
            margin-bottom: 1.5rem;
            font-size: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }
        .form-group { margin-bottom: 1.25rem; }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem;
            background: #121212;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h1 class="brand-title">CUEDESK</h1>
                <p class="brand-subtitle">Snooker Management</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><span>🎱</span> Tables & Games</a>
                <a href="history.html" class="nav-item"><span>📊</span> Session History</a>
                <a href="settings.html" class="nav-item active"><span>⚙️</span> Settings & Rates</a>
                <button id="logout-btn" class="nav-item" style="width: 100%; text-align: left; background: none; border: none; cursor: pointer; margin-top: auto;"><span>🚪</span> Sign Out</button>
            </nav>
        </aside>

        <div class="main-content">
            <header class="top-header">
                <h2 class="header-title">Club Settings & Configurations</h2>
                <div class="owner-profile">
                    <div class="profile-info" style="text-align: right;">
                        <span class="profile-name" id="display-club-name" style="color: var(--gold-primary); font-weight: bold;">Loading...</span>
                        <span class="profile-role">Club Administrator</span>
                    </div>
                    <div class="profile-avatar" id="display-club-avatar">SC</div>
                </div>
            </header>

            <main class="settings-container">
                <!-- Club Profile & Tables Count Card -->
                <div class="settings-card">
                    <h3 class="settings-title">Club Details & Tables</h3>
                    <form id="club-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">Snooker Club Name</label>
                                <input type="text" id="setting-club-name" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Total Tables Count</label>
                                <input type="number" id="setting-total-tables" class="form-input" min="1" max="20" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Update Club Details</button>
                    </form>
                </div>

                <!-- Pricing Rates Card -->
                <div class="settings-card">
                    <h3 class="settings-title">Manage Pricing Rates (Rs.)</h3>
                    <form id="rates-form">
                        <div class="form-group">
                            <label class="form-label">Century Rate (Per Minute)</label>
                            <input type="number" id="rate-century" class="form-input" required min="1">
                        </div>

                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">One Ball / Six Ball (Single)</label>
                                <input type="number" id="rate-oneball-single" class="form-input" required min="1">
                            </div>
                            <div class="form-group">
                                <label class="form-label">One Ball / Six Ball (Double)</label>
                                <input type="number" id="rate-oneball-double" class="form-input" required min="1">
                            </div>
                        </div>

                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label">Full Frame (Single)</label>
                                <input type="number" id="rate-fullframe-single" class="form-input" required min="1">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Full Frame (Double)</label>
                                <input type="number" id="rate-fullframe-double" class="form-input" required min="1">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary" style="margin-top: 1rem; width: 100%;">Save Updated Rates</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script type="module">
        import { supabase } from './js/supabase.js';

        document.addEventListener('DOMContentLoaded', async () => {
            let clubName = localStorage.getItem('cuedesk_club_name') || 'My Snooker Club';
            let totalTables = localStorage.getItem('cuedesk_total_tables') || '5';
            
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (user && user.user_metadata && user.user_metadata.club_name) {
                    clubName = user.user_metadata.club_name;
                    localStorage.setItem('cuedesk_club_name', clubName);
                }
            } catch (e) {}

            document.getElementById('display-club-name').textContent = clubName;
            document.getElementById('setting-club-name').value = clubName;
            document.getElementById('setting-total-tables').value = totalTables;
            
            const initials = clubName.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            document.getElementById('display-club-avatar').textContent = initials || 'SC';

            // Rates Initial Load
            const defaultRates = {
                century: 7,
                oneballSingle: 100,
                oneballDouble: 200,
                fullframeSingle: 150,
                fullframeDouble: 300
            };
            const savedRates = JSON.parse(localStorage.getItem('bt_rates') || JSON.stringify(defaultRates));

            document.getElementById('rate-century').value = savedRates.century;
            document.getElementById('rate-oneball-single').value = savedRates.oneballSingle;
            document.getElementById('rate-oneball-double').value = savedRates.oneballDouble;
            document.getElementById('rate-fullframe-single').value = savedRates.fullframeSingle;
            document.getElementById('rate-fullframe-double').value = savedRates.fullframeDouble;

            // Save Club Details & Tables
            document.getElementById('club-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const newClubName = document.getElementById('setting-club-name').value;
                const newTotalTables = document.getElementById('setting-total-tables').value;

                localStorage.setItem('cuedesk_club_name', newClubName);
                localStorage.setItem('cuedesk_total_tables', newTotalTables);

                try {
                    await supabase.auth.updateUser({
                        data: { club_name: newClubName }
                    });
                } catch (err) {}

                alert('Club details & table count updated successfully!');
                window.location.reload();
            });

            // Save Rates
            document.getElementById('rates-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const updatedRates = {
                    century: parseFloat(document.getElementById('rate-century').value),
                    oneballSingle: parseFloat(document.getElementById('rate-oneball-single').value),
                    oneballDouble: parseFloat(document.getElementById('rate-oneball-double').value),
                    fullframeSingle: parseFloat(document.getElementById('rate-fullframe-single').value),
                    fullframeDouble: parseFloat(document.getElementById('rate-fullframe-double').value)
                };

                localStorage.setItem('bt_rates', JSON.stringify(updatedRates));
                alert('Pricing rates saved successfully!');
            });
        });
    </script>
</body>
</html>
